[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0FDFA"
textColor = "#173B3A"
borderColor = "#B7DDD8"
greenColor = "#15803D"
orangeColor = "#B45309"
redColor = "#B91C1C"
blueColor = "#0F766E"
baseRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#0F766E", "#2563EB", "#B45309", "#7C3AED", "#B91C1C", "#15803D"]
chartSequentialColors = ["#F0FDFA", "#CCFBF1", "#99F6E4", "#5EEAD4", "#2DD4BF", "#14B8A6", "#0D9488", "#0F766E", "#115E59", "#134E4A"]
baseFontSize = 15
headingFontSizes = ["34px", "26px", "21px", "17px", "15px", "13px"]
headingFontWeights = [700, 650, 600, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#ECFDF5"
secondaryBackgroundColor = "#D1FAE5"
textColor = "#173B3A"
borderColor = "#B7DDD8"
